    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f2ea" />
    <script>
      // Apply the theme before first paint (no flash). Dark is the default; the toggle stores a choice.
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") t = "dark"; // dark unless the visitor chose light
        document.documentElement.dataset.theme = t;
        if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0f0f0d");
      } catch (e) {}
    </script>
